    spip: "/mnt/remote_references/containers/spip/spip.latest"
    cutesv: "/mnt/remote_references/containers/cutesv/cutesv.latest"


#threads
threads: 16

tools:        
    dorado:
        model: "/models/dna_r10.4.1_e8.2_400bps_sup@v5.2.0"
        #model: "/models/dna_r10.4.1_e8.2_400bps_hac@v6.0.0"
        kit: "SQK-NBD114-24"
    vep:
        alphamissense: /mnt/remote_references/VEP/plugins/AlphaMissense/AlphaMissense_hg38.tsv.gz
        maxentscan: /mnt/remote_references/VEP/plugins/MaxEntScan
        revel: /mnt/remote_references/VEP/plugins/REVEL/new_tabbed_revel_grch38.tsv.gz
        spliceaisnv: /mnt/remote_references/VEP/plugins/spliceai/spliceai_scores.raw.snv.hg38.vcf.gz
        spliceaiindel: /mnt/remote_references/VEP/plugins/spliceai/spliceai_scores.raw.indel.hg38.vcf.gz
        

    finsurf:
        scores: /mnt/remote_references/finsurf/static/data/scores_all_chroms_1e-4.tsv.gz
        regions: /mnt/remote_references/finsurf/static/data/FINSURF_REGULATORY_REGIONS_GENES.bed.gz

    greenvaran:
        conf: /mnt/RetD/DB/greenvaran/config.json
    
    
    spip:
        maxlines: 1000
        transcriptome: /mnt/diag_references/spip/transcriptome_hg38.RData

    
    cutesv:
        max_cluster_bias_INS: 100
        diff_ratio_merging_INS: 0.3
        max_cluster_bias_DEL: 100
        diff_ratio_merging_DEL: 0.3
        min_support: 4
        min_size: 50
        max_size: 150000
        # Preserve the existing cuteSV command; enable to obtain reference-read counts.
        genotype: false


samples:
  - barcode63
  - barcode32
  - barcode15

barcode_to_sample:
  barcode07: barcode63
  barcode08: barcode32
  barcode15: barcode15
